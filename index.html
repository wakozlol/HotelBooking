<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover comfortable stays and plan your next trip with Hotel Booking."
    />
    <meta name="theme-color" content="#164e63" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./src/styles/file-entry.css" />
    <title>Hotel Booking | Find your next stay</title>
  </head>
  <body>
    <div id="app" data-entry="home"></div>
    <script>
      if (location.protocol === "file:") {
        const fallback = document.createElement("script");
        fallback.src = new URL("./src/file-entry.js", location.href).href;
        document.head.append(fallback);
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
