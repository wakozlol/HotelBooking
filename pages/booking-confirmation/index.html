<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="../../src/styles/file-entry.css" />

    <title>Booking confirmation | Hotel Booking</title>

  <body>
    <div id="app" data-entry="booking-confirmation"></div>

      if (location.protocol === "file:") {

        document.head.append(fallback);
      }
    </script>
    <script type="module" src="../../src/pages/booking-confirmation.js"></script>
